<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MileTrack</title>
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #09090b; color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    input, button, select { font-size: 15px; }
    .card { background-color: #121215; border: 1px solid #1f1f23; }
    .input-clean { background-color: #0c0c0e; border: 1px solid #222226; }
    .input-clean:focus { border-color: #3f3f46; outline: none; }
  </style>
</head>
<body class="p-3.5 pb-20 max-w-md md:max-w-xl mx-auto space-y-3">

  <!-- HEADER -->
  <header class="flex justify-between items-center pt-1 pb-2">
    <div class="flex items-center gap-2">
      <div class="w-2 h-2 rounded-full bg-zinc-600" id="statusDot"></div>
      <h1 class="text-sm font-semibold tracking-tight text-zinc-100">MileTrack <span class="text-zinc-500 font-normal">Pro</span></h1>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleAiModal()" class="text-xs text-zinc-400 hover:text-zinc-200 transition px-2 py-1 rounded-md">
        AI Setup
      </button>
      <span id="shiftBadge" class="text-[11px] font-medium text-zinc-500 bg-zinc-900 border border-zinc-800 px-2.5 py-0.5 rounded-full">
        Offline
      </span>
    </div>
  </header>

  <!-- AI KEY MODAL -->
  <div id="aiModal" class="hidden card rounded-xl p-3.5 space-y-2">
    <div class="flex justify-between items-center">
      <span class="text-xs font-semibold text-zinc-300">Gemini API Key</span>
      <button onclick="toggleAiModal()" class="text-xs text-zinc-500 hover:text-zinc-300">✕</button>
    </div>
    <input type="password" id="geminiKeyInput" placeholder="AIzaSy..." 
           class="w-full input-clean rounded-lg p-2 text-xs font-mono text-zinc-200">
    <div class="flex justify-between items-center pt-1">
      <span class="text-[10px] text-zinc-500">Stored locally on device</span>
      <button onclick="saveAiKey()" class="text-xs bg-zinc-100 text-zinc-900 font-semibold px-3 py-1 rounded-md">
        Save
      </button>
    </div>
  </div>

  <!-- SECTION 1: SHIFT TELEMETRY & DRIVE BUTTON -->
  <section class="card rounded-2xl p-4 space-y-3.5">
    <div class="flex justify-between items-center text-[11px] text-zinc-400">
      <span id="wakeStatus">Screen Normal</span>
      <span id="gpsStatus" class="font-mono text-zinc-500">GPS Standby</span>
    </div>

    <!-- Main Telemetry Grid -->
    <div class="grid grid-cols-4 gap-2 text-center py-1">
      <div>
        <div class="text-[10px] uppercase tracking-wider text-zinc-500 font-medium">Miles</div>
        <div id="liveMiles" class="text-2xl font-light text-zinc-100 font-mono tracking-tight">0.0</div>
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-wider text-zinc-500 font-medium">Speed</div>
        <div id="liveSpeed" class="text-2xl font-light text-zinc-100 font-mono tracking-tight">0</div>
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-wider text-zinc-500 font-medium">Time</div>
        <div id="shiftTimer" class="text-2xl font-light text-zinc-100 font-mono tracking-tight">00:00</div>
      </div>
      <div>
        <div class="text-[10px] uppercase tracking-wider text-zinc-500 font-medium">Net Rate</div>
        <div id="dispHourly" class="text-2xl font-light text-zinc-100 font-mono tracking-tight">$0/h</div>
      </div>
    </div>

    <!-- Single Sleek Shift Button -->
    <button onclick="toggleShift()" id="btnShift" 
            class="w-full h-12 rounded-xl bg-zinc-100 hover:bg-white text-zinc-950 font-semibold text-sm tracking-tight transition active:scale-[0.99] flex items-center justify-center gap-2">
      <span>Start Shift</span>
    </button>
  </section>

  <!-- SECTION 2: 1-TAP RETURN TO HOTSPOT -->
  <section class="card rounded-xl p-3 flex items-center justify-between gap-2">
    <span class="text-[11px] font-medium text-zinc-400 uppercase tracking-wider">Hotspot:</span>
    <div class="flex gap-1.5 overflow-x-auto">
      <button onclick="routeToHotspot('Main St, Fort Lee, NJ')" class="text-xs bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 px-2.5 py-1 rounded-lg text-zinc-300 font-medium">
        Fort Lee
      </button>
      <button onclick="routeToHotspot('River Rd, Edgewater, NJ')" class="text-xs bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 px-2.5 py-1 rounded-lg text-zinc-300 font-medium">
        Edgewater
      </button>
      <button onclick="routeToHotspot('Broad Ave, Palisades Park, NJ')" class="text-xs bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 px-2.5 py-1 rounded-lg text-zinc-300 font-medium">
        Pal Park
      </button>
    </div>
  </section>

  <!-- SECTION 3: MULTI-STOP ROUTER (UP TO 6 STOPS) -->
  <section class="card rounded-2xl p-4 space-y-2.5">
    <div class="flex justify-between items-center">
      <span class="text-xs font-semibold text-zinc-300 tracking-tight">Delivery Stops</span>
      <div class="flex items-center gap-2">
        <label class="text-[11px] text-zinc-400 hover:text-zinc-200 cursor-pointer">
          Scan Screenshot
          <input type="file" accept="image/*" onchange="parseOrderScreenshot(event)" class="hidden">
        </label>
        <span class="text-zinc-700">·</span>
        <button onclick="clearStops()" class="text-[11px] text-zinc-500 hover:text-zinc-300">Clear</button>
      </div>
    </div>

    <!-- Stop Inputs -->
    <div class="space-y-1.5">
      <div class="flex items-center gap-1.5">
        <span class="text-[10px] text-zinc-500 font-mono w-4">1</span>
        <input type="text" id="stop1" placeholder="Pickup or Drop 1..." class="flex-1 input-clean rounded-lg p-2.5 text-xs text-zinc-200">
        <button onclick="voiceDictate('stop1')" class="p-2 text-zinc-400 hover:text-zinc-200 text-xs">🎙️</button>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-[10px] text-zinc-500 font-mono w-4">2</span>
        <input type="text" id="stop2" placeholder="Drop 2..." class="flex-1 input-clean rounded-lg p-2.5 text-xs text-zinc-200">
        <button onclick="voiceDictate('stop2')" class="p-2 text-zinc-400 hover:text-zinc-200 text-xs">🎙️</button>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-[10px] text-zinc-500 font-mono w-4">3</span>
        <input type="text" id="stop3" placeholder="Drop 3 (Optional)..." class="flex-1 input-clean rounded-lg p-2.5 text-xs text-zinc-200">
        <button onclick="voiceDictate('stop3')" class="p-2 text-zinc-400 hover:text-zinc-200 text-xs">🎙️</button>
      </div>
      <div id="rowStop4" class="hidden flex items-center gap-1.5">
        <span class="text-[10px] text-zinc-500 font-mono w-4">4</span>
        <input type="text" id="stop4" placeholder="Drop 4..." class="flex-1 input-clean rounded-lg p-2.5 text-xs text-zinc-200">
        <button onclick="voiceDictate('stop4')" class="p-2 text-zinc-400 hover:text-zinc-200 text-xs">🎙️</button>
      </div>
      <div id="rowStop5" class="hidden flex items-center gap-1.5">
        <span class="text-[10px] text-zinc-500 font-mono w-4">5</span>
        <input type="text" id="stop5" placeholder="Drop 5..." class="flex-1 input-clean rounded-lg p-2.5 text-xs text-zinc-200">
        <button onclick="voiceDictate('stop5')" class="p-2 text-zinc-400 hover:text-zinc-200 text-xs">🎙️</button>
      </div>
      <div id="rowStop6" class="hidden flex items-center gap-1.5">
        <span class="text-[10px] text-zinc-500 font-mono w-4">6</span>
        <input type="text" id="stop6" placeholder="Drop 6..." class="flex-1 input-clean rounded-lg p-2.5 text-xs text-zinc-200">
        <button onclick="voiceDictate('stop6')" class="p-2 text-zinc-400 hover:text-zinc-200 text-xs">🎙️</button>
      </div>
    </div>

    <div class="flex justify-between items-center pt-1">
      <button onclick="addMoreStops()" id="btnAddStop" class="text-xs text-zinc-400 hover:text-zinc-200">
        + Add Stop
      </button>
      <div id="ocrStatus" class="text-[11px] text-zinc-500"></div>
    </div>

    <!-- Google Maps Route Button -->
    <button onclick="launchMultiRoute()" 
            class="w-full h-11 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 font-semibold text-xs tracking-tight transition flex items-center justify-center gap-2">
      <span>Route in Google Maps</span>
    </button>
  </section>

  <!-- SECTION 4: FINANCIALS & REVENUE -->
  <section class="card rounded-2xl p-4 space-y-3">
    <div class="flex justify-between items-center">
      <span class="text-xs font-semibold text-zinc-300 tracking-tight">Shift Financials</span>
      <div class="flex items-center gap-2.5">
        <label class="text-[11px] text-zinc-400 hover:text-zinc-200 cursor-pointer">
          Scan Fuel
          <input type="file" accept="image/*" capture="environment" onchange="scanGasReceipt(event)" class="hidden">
        </label>
        <span class="text-zinc-700">·</span>
        <button onclick="togglePayLogger()" class="text-[11px] text-zinc-400 hover:text-zinc-200">+ Log Pay</button>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-zinc-950 p-2.5 rounded-xl border border-zinc-900">
        <div class="text-[9px] uppercase tracking-wider text-zinc-500 font-medium">Gross</div>
        <div id="dispGross" class="text-sm font-medium text-zinc-200">$0.00</div>
      </div>
      <div class="bg-zinc-950 p-2.5 rounded-xl border border-zinc-900">
        <div class="text-[9px] uppercase tracking-wider text-zinc-500 font-medium">Est. Gas</div>
        <div id="dispGas" class="text-sm font-medium text-zinc-400">-$0.00</div>
      </div>
      <div class="bg-zinc-950 p-2.5 rounded-xl border border-zinc-900">
        <div class="text-[9px] uppercase tracking-wider text-zinc-500 font-medium">Net Pay</div>
        <div id="dispNet" class="text-sm font-semibold text-emerald-400">$0.00</div>
      </div>
    </div>

    <!-- Quick Pay Logger Modal -->
    <div id="payLogModal" class="hidden p-3 bg-zinc-950 rounded-xl border border-zinc-800 space-y-2">
      <div class="flex justify-between items-center">
        <span class="text-xs text-zinc-400">Log Delivery Amount</span>
        <button onclick="togglePayLogger()" class="text-xs text-zinc-600">✕</button>
      </div>
      <div class="flex gap-2">
        <input type="number" id="logPayAmount" placeholder="Amount ($)" step="0.50" 
               class="flex-1 input-clean rounded-lg p-2 text-xs text-zinc-200">
        <button onclick="submitOrderPay()" class="px-4 py-2 bg-zinc-100 text-zinc-950 font-semibold text-xs rounded-lg">
          Add
        </button>
      </div>
    </div>
  </section>

  <!-- FOOTER CONTROLS -->
  <footer class="pt-2 text-[11px] text-zinc-500 flex justify-between items-center border-t border-zinc-900 px-1">
    <div class="flex items-center gap-3">
      <label class="hover:text-zinc-300 cursor-pointer">
        Import Grubhub CSV
        <input type="file" id="importGrubhubFile" accept=".csv" onchange="importGrubhubCSV(event)" class="hidden">
      </label>
      <span>·</span>
      <label class="hover:text-zinc-300 cursor-pointer">
        Timeline.json
        <input type="file" id="importTimelineFile" accept=".json" onchange="importTimeline(event)" class="hidden">
      </label>
    </div>
    <button onclick="exportIRSCSV()" class="hover:text-zinc-300 underline">
      Export CSV
    </button>
  </footer>

  <!-- SILENT AUDIO KEEP-ALIVE -->
  <audio id="keepAliveAudio" loop preload="none">
    <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
  </audio>

  <script>
    let isShiftActive = false;
    let shiftStartMs = null;
    let timerInterval = null;
    let gpsWatchId = null;
    let lastCoords = null;
    let totalShiftMiles = 0;
    let totalGrossPay = parseFloat(localStorage.getItem('mp_gross_pay') || '0');
    let wakeLock = null;
    let visibleStopsCount = 3;

    let geminiKey = localStorage.getItem('mp_gemini_key') || '';

    init();

    function init() {
      updateFinancialDashboard();
      document.getElementById('geminiKeyInput').value = geminiKey;
    }

    // --- HOTSPOT NAVIGATOR ---
    function routeToHotspot(address) {
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(address)}&travelmode=driving`, '_blank');
    }

    // --- MODALS & SETTINGS ---
    function toggleAiModal() { document.getElementById('aiModal').classList.toggle('hidden'); }
    function togglePayLogger() { document.getElementById('payLogModal').classList.toggle('hidden'); }

    function saveAiKey() {
      geminiKey = document.getElementById('geminiKeyInput').value.trim();
      localStorage.setItem('mp_gemini_key', geminiKey);
      toggleAiModal();
      alert('Key saved locally.');
    }

    // --- MULTI-STOP ROUTING (UP TO 6) ---
    function addMoreStops() {
      if (visibleStopsCount < 6) {
        visibleStopsCount++;
        document.getElementById(`rowStop${visibleStopsCount}`).classList.remove('hidden');
        if (visibleStopsCount === 6) document.getElementById('btnAddStop').classList.add('hidden');
      }
    }

    function cleanAddr(raw) {
      return raw.replace(/(apt|suite|unit|bldg|ste)\s*#?[a-z0-9-]+/gi, '').trim();
    }

    function launchMultiRoute() {
      const allStops = [
        cleanAddr(document.getElementById('stop1').value),
        cleanAddr(document.getElementById('stop2').value),
        cleanAddr(document.getElementById('stop3').value),
        cleanAddr(document.getElementById('stop4').value),
        cleanAddr(document.getElementById('stop5').value),
        cleanAddr(document.getElementById('stop6').value)
      ].filter(s => s.length > 0);

      if (allStops.length === 0) {
        alert('Enter at least Stop 1.');
        return;
      }

      if (allStops.length === 1) {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(allStops[0])}&travelmode=driving`, '_blank');
      } else {
        const destination = encodeURIComponent(allStops[allStops.length - 1]);
        const waypoints = allStops.slice(0, allStops.length - 1).map(s => encodeURIComponent(s)).join('|');
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${destination}&waypoints=${waypoints}&travelmode=driving`, '_blank');
      }
    }

    function clearStops() {
      for (let i = 1; i <= 6; i++) document.getElementById(`stop${i}`).value = '';
      visibleStopsCount = 3;
      document.getElementById('rowStop4').classList.add('hidden');
      document.getElementById('rowStop5').classList.add('hidden');
      document.getElementById('rowStop6').classList.add('hidden');
      document.getElementById('btnAddStop').classList.remove('hidden');
    }

    function voiceDictate(targetId) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) { alert('Voice not supported.'); return; }
      const recognition = new SpeechRecognition();
      recognition.onstart = () => { document.getElementById(targetId).placeholder = 'Listening...'; };
      recognition.onresult = (e) => { document.getElementById(targetId).value = e.results[0][0].transcript; };
      recognition.start();
    }

    // --- AI SCREENSHOT PARSER ---
    async function parseOrderScreenshot(event) {
      const file = event.target.files[0];
      if (!file) return;
      const status = document.getElementById('ocrStatus');
      status.innerText = 'Scanning image...';
      if (!geminiKey) { status.innerText = 'Add Gemini key first.'; return; }

      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(',')[1];
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: "Extract delivery/pickup addresses from this delivery app screenshot. Return ONLY a valid JSON array of up to 6 address strings: [\"123 Main St\", \"456 Elm St\"]" },
                  { inline_data: { mime_type: file.type || "image/jpeg", data: base64 } }
                ]
              }]
            })
          });
          const data = await res.json();
          const addresses = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim());

          if (Array.isArray(addresses) && addresses.length > 0) {
            for (let i = 0; i < Math.min(addresses.length, 6); i++) {
              const num = i + 1;
              if (num > 3) document.getElementById(`rowStop${num}`).classList.remove('hidden');
              document.getElementById(`stop${num}`).value = addresses[i];
            }
            status.innerText = `✓ Loaded ${addresses.length} address(es)`;
          }
        } catch (err) { status.innerText = 'Could not parse.'; }
      };
      reader.readAsDataURL(file);
    }

    // --- DRIVING SHIFT ---
    function toggleShift() {
      if (!isShiftActive) startLiveShift();
      else endLiveShift();
    }

    async function startLiveShift() {
      isShiftActive = true;
      shiftStartMs = Date.now();
      totalShiftMiles = 0;
      lastCoords = null;

      document.getElementById('btnShift').innerText = 'End Shift';
      document.getElementById('btnShift').className = 'w-full h-12 rounded-xl bg-red-600 hover:bg-red-500 text-white font-semibold text-sm tracking-tight transition active:scale-[0.99]';
      document.getElementById('shiftBadge').innerText = 'Active';
      document.getElementById('shiftBadge').className = 'text-[11px] font-medium text-emerald-400 bg-emerald-950/60 border border-emerald-900 px-2.5 py-0.5 rounded-full';
      document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-emerald-400';

      // Keep screen awake & background audio active
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          document.getElementById('wakeStatus').innerText = 'Screen Awake';
        }
      } catch (e) {}

      const audio = document.getElementById('keepAliveAudio');
      if (audio) audio.play().catch(() => {});

      timerInterval = setInterval(updateTimer, 1000);

      if ("geolocation" in navigator) {
        document.getElementById('gpsStatus').innerText = 'Locating...';
        gpsWatchId = navigator.geolocation.watchPosition(handleGpsSuccess, null, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
      }
    }

    function handleGpsSuccess(pos) {
      document.getElementById('gpsStatus').innerText = `±${Math.round(pos.coords.accuracy * 3.28)}ft`;
      if (pos.coords.speed !== null && pos.coords.speed >= 0) {
        document.getElementById('liveSpeed').innerText = Math.round(pos.coords.speed * 2.23694);
      }
      if (lastCoords) {
        const dist = haversineMiles(lastCoords.latitude, lastCoords.longitude, pos.coords.latitude, pos.coords.longitude);
        if (dist >= 0.003) {
          totalShiftMiles += dist;
          document.getElementById('liveMiles').innerText = totalShiftMiles.toFixed(1);
          updateFinancialDashboard();
        }
      }
      lastCoords = pos.coords;
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - shiftStartMs) / 1000);
      const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
      const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
      document.getElementById('shiftTimer').innerText = `${h}:${m}`;
      updateFinancialDashboard();
    }

    function endLiveShift() {
      isShiftActive = false;
      clearInterval(timerInterval);
      if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
      if (wakeLock) { wakeLock.release(); wakeLock = null; }
      const audio = document.getElementById('keepAliveAudio');
      if (audio) { audio.pause(); audio.currentTime = 0; }

      const deduction = (totalShiftMiles * 0.67).toFixed(2);
      const history = JSON.parse(localStorage.getItem('miletrack_history') || '[]');
      history.push({
        date: new Date().toISOString().split('T')[0],
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        miles: parseFloat(totalShiftMiles.toFixed(2)),
        deduction: deduction,
        purpose: 'Delivery Shift'
      });
      localStorage.setItem('miletrack_history', JSON.stringify(history));

      document.getElementById('btnShift').innerText = 'Start Shift';
      document.getElementById('btnShift').className = 'w-full h-12 rounded-xl bg-zinc-100 hover:bg-white text-zinc-950 font-semibold text-sm tracking-tight transition active:scale-[0.99]';
      document.getElementById('shiftBadge').innerText = 'Offline';
      document.getElementById('shiftBadge').className = 'text-[11px] font-medium text-zinc-500 bg-zinc-900 border border-zinc-800 px-2.5 py-0.5 rounded-full';
      document.getElementById('statusDot').className = 'w-2 h-2 rounded-full bg-zinc-600';
      document.getElementById('wakeStatus').innerText = 'Screen Normal';
      document.getElementById('gpsStatus').innerText = 'GPS Standby';

      alert(`Shift Logged: ${totalShiftMiles.toFixed(1)} mi ($${deduction} write-off)`);
    }

    function haversineMiles(lat1, lon1, lat2, lon2) {
      const R = 3958.8;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // --- FINANCIALS ---
    function submitOrderPay() {
      const amt = parseFloat(document.getElementById('logPayAmount').value);
      if (!amt || amt <= 0) return;
      totalGrossPay += amt;
      localStorage.setItem('mp_gross_pay', totalGrossPay.toString());
      document.getElementById('logPayAmount').value = '';
      togglePayLogger();
      updateFinancialDashboard();
    }

    function updateFinancialDashboard() {
      const gas = (totalShiftMiles * 0.14);
      const net = totalGrossPay - gas;
      let hrs = 1;
      if (shiftStartMs) hrs = Math.max(0.1, (Date.now() - shiftStartMs) / 3600000);
      const hourly = (net / hrs).toFixed(2);

      document.getElementById('dispGross').innerText = `$${totalGrossPay.toFixed(2)}`;
      document.getElementById('dispGas').innerText = `-$${gas.toFixed(2)}`;
      document.getElementById('dispNet').innerText = `$${net.toFixed(2)}`;
      document.getElementById('dispHourly').innerText = `$${hourly}/h`;
    }

    // --- GRUBHUB CSV IMPORTER ---
    function importGrubhubCSV(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const lines = evt.target.result.split('\n');
          let addedEarn = 0, addedMiles = 0, count = 0;
          const dedup = new Set(JSON.parse(localStorage.getItem('mp_gh_dedup') || '[]'));
          const history = JSON.parse(localStorage.getItem('miletrack_history') || '[]');

          for (let i = 1; i < lines.length; i++) {
            const row = lines[i].trim();
            if (!row) continue;
            const cols = row.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            const dt = cols[0], type = cols[1], amt = parseFloat(cols[2]?.replace(/[$\s]/g, '')) || 0;
            const status = cols[4], rest = cols[5] || 'Grubhub', mi = parseFloat(cols[7]) || 0;
            const key = `${dt}_${type}_${amt}_${rest}`;
            if (dedup.has(key)) continue;

            if (type === 'DELIVERY' && status === 'ACCEPTED') {
              count++; addedEarn += amt; addedMiles += mi; dedup.add(key);
              history.push({ date: dt.split('T')[0], miles: mi, deduction: (mi * 0.67).toFixed(2), purpose: `Grubhub (${rest})` });
            } else if (type === 'MISSION' && amt > 0) {
              addedEarn += amt; dedup.add(key);
            }
          }
          localStorage.setItem('mp_gh_dedup', JSON.stringify(Array.from(dedup)));
          localStorage.setItem('miletrack_history', JSON.stringify(history));
          totalGrossPay += addedEarn;
          localStorage.setItem('mp_gross_pay', totalGrossPay.toString());
          updateFinancialDashboard();
          alert(`Added: ${count} deliveries (+$${addedEarn.toFixed(2)}, +${addedMiles.toFixed(1)} mi)`);
        } catch (err) { alert('CSV parse error.'); }
      };
      reader.readAsText(file);
    }

    function exportIRSCSV() {
      const history = JSON.parse(localStorage.getItem('miletrack_history') || '[]');
      if (history.length === 0) { alert('No trips logged.'); return; }
      let csv = 'Date,Miles,Tax Deduction,Purpose\n';
      history.forEach(h => { csv += `"${h.date}",${h.miles},"$${h.deduction}","${h.purpose}"\n`; });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'IRS_Mileage_Log.csv';
      a.click();
    }

    function importTimeline(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const raw = JSON.parse(evt.target.result);
          const segments = raw.semanticSegments || raw.timelineObjects || [];
          let miTotal = 0;
          const history = JSON.parse(localStorage.getItem('miletrack_history') || '[]');
          segments.forEach(seg => {
            const act = seg.activity || seg.activitySegment;
            if (act && act.topCandidate && act.topCandidate.type.match(/VEHICLE|DRIVING/)) {
              const m = Number(act.distanceMeters || act.distance) || 0;
              if (m >= 100) {
                const mi = Number((m * 0.000621371).toFixed(2));
                history.push({ date: new Date(seg.startTime).toISOString().split('T')[0], miles: mi, deduction: (mi * 0.67).toFixed(2), purpose: 'Timeline Drive' });
                miTotal += mi;
              }
            }
          });
          localStorage.setItem('miletrack_history', JSON.stringify(history));
          alert(`Imported ${miTotal.toFixed(1)} miles from Timeline.json`);
        } catch (err) { alert('Error reading file.'); }
      };
      reader.readAsText(file);
    }

    async function scanGasReceipt(event) {
      const file = event.target.files[0];
      if (!file || !geminiKey) { alert('Set Gemini key in AI Setup first.'); return; }
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64 = e.target.result.split(',')[1];
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: "Extract total dollar amount as JSON: {\"total\": number}" }, { inline_data: { mime_type: file.type || "image/jpeg", data: base64 } }] }] })
          });
          const data = await res.json();
          const parsed = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim());
          alert(`Logged Fuel: $${parsed.total}`);
        } catch (err) { alert('Receipt scan failed.'); }
      };
      reader.readAsDataURL(file);
    }
  </script>
